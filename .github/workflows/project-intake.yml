name: Project Intake Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  collect-project-intake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project manifest
        run: python scripts/project_intake.py --root .

      - name: Upload intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-intake-artifact
          path: |
            automation_output/
